name: Build Python Executables

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'  # Specify your desired Python version.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable
        run: |
          if ([[ ${{ matrix.os }} == 'ubuntu-latest' ]]); then
            pyinstaller --onefile converter.py --distpath=./linux_dist
          else
            pyinstaller --onefile converter.py --distpath=./windows_dist
          fi

      - name: Upload Executable
        uses: actions/upload-artifact@v4
        with:
          name: ferium-to-mmm
          path: |
            linux_dist/*
            windows_dist/*
